---

- name: Create systemd service for auto-restart
  copy:
    content: |
          [Unit]
          Description=Inception Docker Compose
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          User=ubuntu
          WorkingDirectory=/home/ubuntu/inception
          ExecStart=/usr/local/bin/docker-compose up -d
          ExecStop=/usr/local/bin/docker-compose down

          [Install]
          WantedBy=multi-user.target
    dest: /etc/systemd/system/inception.service
    
- name: Enable inception service
  systemd:
    name: inception
    enabled: yes  #systemctl enable inception => starts on boot
    daemon_reload: yes #systemctl daemon-reload => read all service files again
    